<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORACLE CHAT</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-shell">
        <header class="chat-header">
            <div class="header-brand">
                <span class="status-dot" aria-hidden="true"></span>
                <h1>ORACLE CHAT</h1>
            </div>
            <span class="header-badge">UI Preview</span>
        </header>

        <main id="chat-history" class="chat-history" aria-live="polite">
            <div id="empty-state" class="empty-state">
                <h2>How can I help you today?</h2>
                <p>Type a message below to test the chat interface.</p>
            </div>
        </main>

        <footer class="chat-input-area">
            <form id="chat-form" class="chat-form">
                <textarea
                    id="message-input"
                    class="message-input"
                    rows="1"
                    placeholder="Message ORACLE CHAT..."
                    aria-label="Message input"
                ></textarea>
                <button id="send-button" class="send-button" type="submit" disabled aria-label="Send message">
                    Send
                </button>
            </form>
            <p class="input-hint">Press Enter to send, Shift + Enter for a new line.</p>
        </footer>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
