name: Auto Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Oracle VM over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== Pulling latest changes on Oracle VM ==="
            cd /home/ubuntu/oracle_chat
            git fetch origin main
            git reset --hard origin/main

            echo "=== Updating Python dependencies ==="
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "=== Setting up systemd service for Telegram Bot ==="
            sudo tee /etc/systemd/system/oracle-bot.service > /dev/null << 'SERVICE'
            [Unit]
            Description=Custom Telegram Ollama Bot
            After=network.target ollama.service
            Wants=ollama.service

            [Service]
            Type=simple
            User=ubuntu
            WorkingDirectory=/home/ubuntu/oracle_chat
            EnvironmentFile=/home/ubuntu/oracle_chat/.env
            ExecStart=/home/ubuntu/oracle_chat/venv/bin/python /home/ubuntu/oracle_chat/bot/main.py
            Restart=always
            RestartSec=10
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
            SERVICE

            echo "=== Restarting oracle-bot service ==="
            sudo systemctl daemon-reload
            sudo systemctl enable oracle-bot
            sudo systemctl restart oracle-bot

            echo "=== Checking service health ==="
            sleep 2
            sudo systemctl is-active --quiet oracle-bot && echo "oracle-bot service is ACTIVE and RUNNING!"
